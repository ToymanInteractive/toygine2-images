name: Build Sega Mega Drive/Genesis toolchain

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile.md
      - .github/workflows/build_md.yaml
      - .github/workflows/_docker_build.yaml
  pull_request:
    branches:
      - main
    paths:
      - Dockerfile.md
      - .github/workflows/build_md.yaml
      - .github/workflows/_docker_build.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_docker_build.yaml
    with:
      image: md
      # ClownMDSDK toolchain (incl. GCC) and BlastEm are built from source; arm64 under QEMU needs extra time.
      # A cold build already took ~233 min before BlastEm, so the timeout is at the hosted-runner maximum.
      timeout: 360
