name: Build Sega Mega Drive/Genesis toolchain

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile.md
      - .github/workflows/build_md.yaml
      - .github/workflows/_docker_build_native.yaml
  pull_request:
    branches:
      - main
    paths:
      - Dockerfile.md
      - .github/workflows/build_md.yaml
      - .github/workflows/_docker_build_native.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_docker_build_native.yaml
    with:
      image: md
      # ClownMDSDK (incl. GCC) and BlastEm compile from source. A cold build on native runners
      # took 16 min on amd64 and 13 on arm64; the rest is headroom for a slow runner.
      timeout: 180
