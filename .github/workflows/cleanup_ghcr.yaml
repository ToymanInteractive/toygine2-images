name: Cleanup GHCR

on:
  schedule:
    # Daily 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Preview deletions without removing anything"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  cleanup:
    concurrency:
      group: cleanup-images-${{ matrix.image }}
      cancel-in-progress: false
    name: Cleanup ${{ matrix.image }} old images
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      # Required to delete GHCR package versions owned by the repo's org.
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # Every image published by a build_<image>.yaml caller; add new targets here too.
        include:
          - image: 3ds
          - image: gba
          - image: gc
          - image: md
          - image: n64
          - image: nds
          - image: switch
          - image: wii
          - image: wiiu
    defaults:
      run:
        shell: bash

    steps:
      - name: Prune old GHCR versions
        uses: snok/container-retention-policy@v3.1.0
        with:
          account: toymaninteractive
          token: ${{ secrets.GITHUB_TOKEN }}
          image-names: toygine2.${{ matrix.image }}.toolchain
          # Keep "latest" and every buildcache ref: the shared one from _docker_build.yaml and
          # the per-platform ones from _docker_build_native.yaml.
          image-tags: "!latest !buildcache*"
          # Also clean orphaned untagged manifests; since v3.1.0 the children of kept multi-arch
          # tags are protected automatically.
          tag-selection: both
          # Grace period: skip anything younger than a day, such as a build that just published.
          # Retention itself is keep-n-most-recent.
          cut-off: 1d
          # Keep the 10 most recent dated (YYYYMMDD) tags.
          keep-n-most-recent: 10
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || false }}
