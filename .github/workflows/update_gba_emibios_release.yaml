name: Update emibios release

on:
  schedule:
    # Weekly on Saturday 01:00 UTC
    - cron: "0 1 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    concurrency:
      group: update-emibios-release
      cancel-in-progress: false
    name: Bump emibios release
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Resolve latest emibios release
        id: emibios
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # releases/latest skips drafts and prereleases; the pinned sha256 is GitHub's upload digest.
        run: |
          release=$(curl -fsSL --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/coolbho3k/emibios/releases/latest)
          latest=$(jq -r .tag_name <<< "${release}")
          digest=$(jq -r '.assets[] | select(.name == "gba_bios.bin") | .digest' <<< "${release}")
          # The tag goes into sed and a download URL, so allow only version characters.
          if ! [[ "${latest}" =~ ^[0-9A-Za-z._-]+$ ]]; then
            echo "::error::Unexpected emibios release tag: '${latest}'" >&2
            exit 1
          fi
          if ! [[ "${digest}" =~ ^sha256:([0-9a-f]{64})$ ]]; then
            echo "::error::No sha256 digest for gba_bios.bin in emibios ${latest}: '${digest}'" >&2
            exit 1
          fi
          echo "version=${latest}" >> "${GITHUB_OUTPUT}"
          echo "sha256=${BASH_REMATCH[1]}" >> "${GITHUB_OUTPUT}"

      - name: Update Dockerfile.gba
        id: update
        env:
          LATEST: ${{ steps.emibios.outputs.version }}
          LATEST_SHA256: ${{ steps.emibios.outputs.sha256 }}
        run: |
          current=$(grep -oP '^ARG EMIBIOS_VERSION=\K\S+' Dockerfile.gba) || {
            echo "::error::Failed to extract EMIBIOS_VERSION from Dockerfile.gba" >&2
            exit 1
          }
          echo "current=${current}"
          echo "latest=${LATEST}"
          if [ "${current}" = "${LATEST}" ]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "Already up to date."
            exit 0
          fi
          sed -i \
            -e "s/^ARG EMIBIOS_VERSION=.*/ARG EMIBIOS_VERSION=${LATEST}/" \
            -e "s/^ARG EMIBIOS_SHA256=.*/ARG EMIBIOS_SHA256=${LATEST_SHA256}/" \
            Dockerfile.gba
          updated=$(grep -oP '^ARG EMIBIOS_VERSION=\K\S+' Dockerfile.gba)
          updated_sha256=$(grep -oP '^ARG EMIBIOS_SHA256=\K[0-9a-f]+' Dockerfile.gba)
          if [ "${updated}" != "${LATEST}" ] || [ "${updated_sha256}" != "${LATEST_SHA256}" ]; then
            echo "::error::Failed to update EMIBIOS_VERSION/EMIBIOS_SHA256 in Dockerfile.gba" >&2
            exit 1
          fi
          echo "changed=true" >> "${GITHUB_OUTPUT}"
          echo "current=${current}" >> "${GITHUB_OUTPUT}"

      - name: Create Pull Request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          sign-commits: true
          branch: chore/bump-emibios-release
          delete-branch: true
          commit-message: "chore(deps): bump emibios to ${{ steps.emibios.outputs.version }}"
          title: "chore(deps): bump emibios to ${{ steps.emibios.outputs.version }}"
          assignees: dkrutskikh
          body: |
            Automated weekly bump of the pinned emibios release in `Dockerfile.gba`.

            - Repo: https://github.com/coolbho3k/emibios
            - From: `${{ steps.update.outputs.current }}`
            - To: `${{ steps.emibios.outputs.version }}` (latest release)
            - `gba_bios.bin` sha256: `${{ steps.emibios.outputs.sha256 }}`
            - Release notes: https://github.com/coolbho3k/emibios/releases/tag/${{ steps.emibios.outputs.version }}
            - Compare: https://github.com/coolbho3k/emibios/compare/${{ steps.update.outputs.current }}...${{ steps.emibios.outputs.version }}
