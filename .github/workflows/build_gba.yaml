name: Build Nintendo Game Boy Advance toolchain

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile.gba
      - .github/workflows/build_gba.yaml
      - .github/workflows/_docker_build_native.yaml
  pull_request:
    branches:
      - main
    paths:
      - Dockerfile.gba
      - .github/workflows/build_gba.yaml
      - .github/workflows/_docker_build_native.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_docker_build_native.yaml
    with:
      image: gba
      # mGBA compiles from source; one emulated job built both platforms in 13 min, so 60 fits.
      timeout: 60
