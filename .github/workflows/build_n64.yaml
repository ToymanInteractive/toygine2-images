name: Build Nintendo 64 toolchain

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile.n64
      - .github/workflows/build_n64.yaml
      - .github/workflows/_docker_build_native.yaml
  pull_request:
    branches:
      - main
    paths:
      - Dockerfile.n64
      - .github/workflows/build_n64.yaml
      - .github/workflows/_docker_build_native.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_docker_build_native.yaml
    with:
      image: n64
      # Libdragon's toolchain (binutils, GCC, newlib) and its library compile from source. No CI
      # number yet: a cold native arm64 build took 19 min locally with 4 jobs, so this leaves room
      # for a slower runner until a measured build replaces it.
      timeout: 180
