name: Build Docker image

# Reusable build/publish logic shared by the per-image build_<image>.yaml workflows.
# Each caller triggers on its own Dockerfile and on this file, so editing one Dockerfile
# rebuilds only that image, while a change here rebuilds all of them.
on:
  workflow_call:
    inputs:
      image:
        description: Image target; selects Dockerfile.<image> and the published image name.
        required: true
        type: string
      timeout:
        description: Job timeout in minutes.
        required: false
        type: number
        default: 30
      compiler-version:
        description: Command that prints the compiler version, run with sh -c in the image.
        required: true
        type: string
      compiler-tag:
        description: Prefix of the compiler version tag, such as gcc for gcc-16.2.0.
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    concurrency:
      group: docker-build-${{ inputs.image }}-${{ github.ref }}
      # Never cancel an in-flight publish on main; supersede stale PR builds.
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    permissions:
      contents: read
      packages: write

    name: ${{ inputs.image }}
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ inputs.timeout }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check base image matches its label
        # Dependabot rewrites the FROM tag and leaves org.opencontainers.image.base.name untouched.
        # This step runs before buildx so a mismatch fails in seconds instead of after a push.
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          dockerfile="Dockerfile.$IMAGE"
          from=$(grep '^FROM ' "$dockerfile" | tail -1 | awk '{print $2}')
          label=$(grep -o 'image.base.name="[^"]*"' "$dockerfile" | cut -d'"' -f2)
          # docker.io/library/debian:x and debian:x name one image, so both sides are normalized
          # and only a tag difference fails the step.
          from=${from#docker.io/}
          from=${from#library/}
          label=${label#docker.io/}
          label=${label#library/}
          if [ "$from" != "$label" ]; then
            echo "::error file=$dockerfile::FROM $from does not match base.name label $label"
            exit 1
          fi

      # No setup-qemu-action: these images run commands only in --platform=$BUILDPLATFORM stages.
      # One that gains a RUN on the target platform moves to _docker_build_native.yaml.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        # Forked-PR runs have no secrets, so login is skipped and cache reads may miss; the build
        # still validates. Push and dispatch runs always log in.
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute build date
        id: build_date
        # One UTC date feeds both the date tag and the version label, so a build
        # started just before midnight cannot tag 20260731 while labelling 20260801.
        # Only build-time values go here; static labels live in each Dockerfile.
        run: |
          {
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "version=$(date -u +%Y%m%d)"
          } >> "$GITHUB_OUTPUT"

      - name: Build only
        if: ${{ github.ref != 'refs/heads/main' }}
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile.${{ inputs.image }}
          platforms: linux/amd64,linux/arm64
          # Provenance disabled: multi-platform attestations break some registries and runtimes
          # (docker/build-push-action#781).
          provenance: false
          push: false
          cache-from: type=registry,ref=ghcr.io/toymaninteractive/toygine2.${{ inputs.image }}.toolchain:buildcache

      - name: Build and push
        id: push
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile.${{ inputs.image }}
          platforms: linux/amd64,linux/arm64
          provenance: false
          # Untagged until the compiler check in the next step passes.
          outputs: type=image,name=ghcr.io/toymaninteractive/toygine2.${{ inputs.image }}.toolchain,push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.created=${{ steps.build_date.outputs.created }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.build_date.outputs.version }}
          cache-from: type=registry,ref=ghcr.io/toymaninteractive/toygine2.${{ inputs.image }}.toolchain:buildcache
          cache-to: type=registry,ref=ghcr.io/toymaninteractive/toygine2.${{ inputs.image }}.toolchain:buildcache,mode=max

      - name: Publish tags
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          IMAGE: ghcr.io/toymaninteractive/toygine2.${{ inputs.image }}.toolchain
          DIGEST: ${{ steps.push.outputs.digest }}
          VERSION: ${{ steps.build_date.outputs.version }}
          COMPILER_VERSION: ${{ inputs.compiler-version }}
          COMPILER_TAG: ${{ inputs.compiler-tag }}
          GH_TOKEN: ${{ github.token }}
        # The base image pins the compiler, so the step asks the pushed image for its version. It
        # runs the amd64 build only; arm64 ships the same release.
        run: |
          compiler=$(docker run --rm --platform linux/amd64 "${IMAGE}@${DIGEST}" \
            sh -c "$COMPILER_VERSION")
          if [[ ! "$compiler" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::'$COMPILER_VERSION' printed '$compiler', not a version"
            exit 1
          fi
          # A re-run of an older commit must not roll latest or the compiler tag back.
          tags=(-t "${IMAGE}:${VERSION}")
          head=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          if [ "$head" = "$GITHUB_SHA" ]; then
            tags+=(-t "${IMAGE}:latest" -t "${IMAGE}:${COMPILER_TAG}-${compiler}")
          else
            echo "::warning::main moved to $head since $GITHUB_SHA; publishing $VERSION only"
          fi
          docker buildx imagetools create "${tags[@]}" "${IMAGE}@${DIGEST}"
