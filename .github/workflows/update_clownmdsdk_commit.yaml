name: Update ClownMDSDK commit

on:
  schedule:
    # Weekly on Saturday 01:00 UTC
    - cron: "0 1 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    concurrency:
      group: update-clownmdsdk-commit
      cancel-in-progress: false
    name: Bump ClownMDSDK commit
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Resolve latest ClownMDSDK master commit
        id: clownmdsdk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Clownacy/clownmdsdk/commits/master \
            | jq -r .sha)
          if [ -z "${latest}" ] || [ "${latest}" = "null" ]; then
            echo "::error::Failed to resolve latest ClownMDSDK master commit" >&2
            exit 1
          fi
          echo "sha=${latest}" >> "${GITHUB_OUTPUT}"
          echo "short=${latest:0:7}" >> "${GITHUB_OUTPUT}"

      - name: Update Dockerfile.genesis
        id: update
        env:
          LATEST: ${{ steps.clownmdsdk.outputs.sha }}
        run: |
          current=$(grep -oP '^ARG CLOWNMDSDK_COMMIT=\K[0-9a-f]+' Dockerfile.genesis) || {
            echo "::error::Failed to extract CLOWNMDSDK_COMMIT from Dockerfile.genesis" >&2
            exit 1
          }
          if [ -z "${current}" ]; then
            echo "::error::CLOWNMDSDK_COMMIT not found in Dockerfile.genesis" >&2
            exit 1
          fi
          echo "current=${current}"
          echo "latest=${LATEST}"
          if [ "${current}" = "${LATEST}" ]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "Already up to date."
            exit 0
          fi
          sed -i "s/^ARG CLOWNMDSDK_COMMIT=.*/ARG CLOWNMDSDK_COMMIT=${LATEST}/" Dockerfile.genesis
          updated=$(grep -oP '^ARG CLOWNMDSDK_COMMIT=\K[0-9a-f]+' Dockerfile.genesis)
          if [ "${updated}" != "${LATEST}" ]; then
            echo "::error::Failed to update CLOWNMDSDK_COMMIT in Dockerfile.genesis" >&2
            exit 1
          fi
          echo "changed=true" >> "${GITHUB_OUTPUT}"
          echo "current=${current}" >> "${GITHUB_OUTPUT}"

      - name: Create Pull Request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          sign-commits: true
          branch: chore/bump-clownmdsdk-commit
          delete-branch: true
          commit-message: "chore(deps): bump ClownMDSDK to ${{ steps.clownmdsdk.outputs.short }}"
          title: "chore(deps): bump ClownMDSDK to ${{ steps.clownmdsdk.outputs.short }}"
          assignees: dkrutskikh
          body: |
            Automated weekly bump of the pinned ClownMDSDK commit in `Dockerfile.genesis`.

            - Repo: https://github.com/Clownacy/clownmdsdk
            - From: `${{ steps.update.outputs.current }}`
            - To: `${{ steps.clownmdsdk.outputs.sha }}` (master HEAD)
            - Compare: https://github.com/Clownacy/clownmdsdk/compare/${{ steps.update.outputs.current }}...${{ steps.clownmdsdk.outputs.sha }}
